<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LanWatch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/readex-pro-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try {
      const theme = localStorage.getItem('lw.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      if (localStorage.getItem('lw.lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#deviceList" data-i18n="skip">Skip to device list</a>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="8" width="28" height="16" rx="4" fill="var(--plate)"/><rect x="6.5" y="14" width="5" height="4" rx="1" fill="var(--led-on)"/><rect x="13.5" y="14" width="5" height="4" rx="1" fill="var(--led-on)"/><rect x="20.5" y="14" width="5" height="4" rx="1" fill="var(--led-new)"/></svg>
      <div>
        <h1 data-i18n="title">Devices on the network</h1>
        <p class="netline" id="netline"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="scanBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>
        <span id="scanLabel" data-i18n="scan_now">Scan now</span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button">
        <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn lang" id="langBtn" type="button" lang="ar">ع</button>
    </div>
  </header>

  <main class="wrap">
    <section class="faceplate" id="faceplate" aria-labelledby="fpTitle">
      <div class="fp-head">
        <h2 class="silk" id="fpTitle" data-i18n="panel_title">Port panel</h2>
        <span class="silk" id="fpNet" dir="ltr"></span>
      </div>
      <div class="ports" id="ports" dir="ltr" role="list"></div>
      <div class="fp-foot">
        <p class="fp-count"><span class="big" id="onlineCount">0</span><span id="onlineLabel" data-i18n="online_now">online now</span></p>
        <div class="fp-stats" role="group">
          <button type="button" class="fp-stat" data-filter="all"><i class="dot dot-all"></i><span data-i18n="total">Total</span><b id="statTotal">0</b></button>
          <button type="button" class="fp-stat" data-filter="new"><i class="dot dot-new"></i><span data-i18n="new">New</span><b id="statNew">0</b></button>
          <button type="button" class="fp-stat" data-filter="offline"><i class="dot dot-off"></i><span data-i18n="offline">Offline</span><b id="statOffline">0</b></button>
        </div>
        <p class="fp-scan" id="fpScan"></p>
      </div>
      <div class="fp-progress" aria-hidden="true"></div>
    </section>

    <div id="notices" class="notices" aria-live="polite"></div>

    <section class="toolbar" data-i18n-aria="filters" aria-label="Filter devices">
      <label class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search_ph" placeholder="Search by name, IP, MAC or vendor">
      </label>
      <div class="segments" id="filters" role="radiogroup"></div>
      <label class="sort">
        <span data-i18n="sort_label">Sort</span>
        <select id="sort">
          <option value="ip" data-i18n="sort_ip">By address</option>
          <option value="name" data-i18n="sort_name">By name</option>
          <option value="seen" data-i18n="sort_seen">By last seen</option>
          <option value="vendor" data-i18n="sort_vendor">By vendor</option>
        </select>
      </label>
    </section>

    <div class="layout">
      <section class="register" aria-labelledby="regTitle">
        <h2 class="sr-only" id="regTitle" data-i18n="devices">Devices</h2>
        <div class="reg-head" aria-hidden="true">
          <span></span>
          <span data-i18n="col_device">Device</span>
          <span data-i18n="col_address">Address</span>
          <span data-i18n="col_presence">Last 24 hours</span>
          <span data-i18n="col_status">Status</span>
        </div>
        <div id="deviceList" tabindex="-1"></div>
      </section>

      <aside class="activity" aria-labelledby="actTitle">
        <h2 id="actTitle" data-i18n="activity">Activity</h2>
        <ol id="events" class="events"></ol>
      </aside>
    </div>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <div class="drawer-id" id="drawerId"></div>
      <button class="icon-btn" id="drawerClose" type="button" data-i18n-aria="close" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div id="drawerInfo"></div>
      <form id="drawerForm" class="dform" novalidate></form>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
