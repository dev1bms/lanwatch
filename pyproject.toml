[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lanwatch"
dynamic = ["version"]
description = "Self-hosted dashboard that shows which devices are on your local network right now."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Belal Alsweirki" }]
requires-python = ">=3.11"
keywords = ["network", "lan", "arp", "scanner", "self-hosted", "homelab", "dashboard", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "scapy>=2.6,<3",
    "netaddr>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
lanwatch = "lanwatch.__main__:main"

[project.urls]
Homepage = "https://github.com/dev1bms/lanwatch"
Issues = "https://github.com/dev1bms/lanwatch/issues"

[tool.hatch.version]
path = "src/lanwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lanwatch"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "PIE", "PT", "PL", "RUF", "PERF"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scapy.*", "netaddr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
